name: Fetch Quaternius UAL2 prone transitions
on:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - '.github/workflows/fetch-ual2.yml'
permissions:
  contents: write
jobs:
  fetch-ual2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official CC0 UAL2 Standard and add it to the game
        shell: bash
        run: |
          set -euo pipefail
          verify_clips() {
            python - <<'PY'
          import json, struct
          path = 'assets/UAL2_Standard.glb'
          with open(path, 'rb') as f:
              data = f.read()
          magic, version, total = struct.unpack_from('<4sII', data, 0)
          if magic != b'glTF' or total != len(data):
              raise SystemExit('Invalid GLB container')
          chunk_len, chunk_type = struct.unpack_from('<II', data, 12)
          if chunk_type != 0x4E4F534A:
              raise SystemExit('GLB JSON chunk missing')
          doc = json.loads(data[20:20+chunk_len].decode('utf-8').rstrip(' \\0'))
          names = {a.get('name') for a in doc.get('animations', [])}
          required = {'IdleToLay', 'LayToIdle'}
          missing = required - names
          print('UAL2 animation clips:', ', '.join(sorted(names)))
          if missing:
              raise SystemExit('Missing required clips: ' + ', '.join(sorted(missing)))
          PY
          }
          if [ -s assets/UAL2_Standard.glb ]; then
            verify_clips
            echo "UAL2 present and both prone transitions verified"
            exit 0
          fi
          mkdir -p assets
          response="$(curl -fsSL -X POST 'https://quaternius.itch.io/universal-animation-library-2/file/17958478?source=game_download&as_props=1' -H 'Accept: application/json' -H 'Content-Type: application/json' --data '{}')"
          url="$(printf '%s' "$response" | jq -r '.url // empty')"
          test -n "$url"
          curl -fL "$url" -o /tmp/ual2.zip
          echo '4008ea208a604773a2b2177d965f0f5d3195498b5bf838c3f5785d68e95f2a68  /tmp/ual2.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile, shutil
          archive = zipfile.ZipFile('/tmp/ual2.zip')
          entry = next((name for name in archive.namelist() if name.endswith('/Unreal-Godot/UAL2_Standard.glb')), None)
          if entry is None:
              raise SystemExit('UAL2_Standard.glb not found in official archive')
          with archive.open(entry) as source, open('assets/UAL2_Standard.glb', 'wb') as target:
              shutil.copyfileobj(source, target)
          PY
          test -s assets/UAL2_Standard.glb
          test "$(head -c 4 assets/UAL2_Standard.glb)" = 'glTF'
          verify_clips
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/UAL2_Standard.glb
          if ! git diff --cached --quiet; then
            git commit -m 'Add Quaternius UAL2 CC0 prone transition animations'
            git push
          fi
