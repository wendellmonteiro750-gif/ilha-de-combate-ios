name: JavaScript syntax and rig tests
on:
  push:
    branches: [main, novo-battle-royale]
    paths:
      - 'game.js'
      - 'player-rig-math.mjs'
      - 'tests/**'
      - '.github/workflows/syntax-check.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check game.js
      - run: node --check player-rig-math.mjs
      - run: node --test tests/*.test.mjs
