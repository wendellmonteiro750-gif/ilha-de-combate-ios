<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ilha de Combate — 3D</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="game"></div>
<div id="loading">CARREGANDO ILHA DE COMBATE 3D…</div>
<div id="errorPanel"><div><h1>Não foi possível iniciar o jogo</h1><p id="errorMessage">Verifique sua conexão com a internet e tente novamente.</p><button onclick="location.reload()">TENTAR NOVAMENTE</button></div></div>
<div id="hud">
 <div class="hud-top">
  <div class="player-card"><div class="avatar">IC</div><div class="player-info"><b>ILHA DE COMBATE</b><small id="status">● EM COMBATE</small></div></div>
  <div class="match-info"><span><b id="score">0</b><small>ABATES</small></span><span><b>5</b><small>INIMIGOS</small></span></div>
  <div class="minimap"><div class="map-grid"></div><div class="map-cross"></div><div id="radarDots"></div><i class="player-arrow"></i><small>MAPA</small></div>
 </div>
 <div class="stats"><span id="health">VIDA 100</span><span id="ammo">MUNIÇÃO 30</span></div>
 <div class="health-panel"><div class="health-label"><b>HP</b><strong id="healthValue">100</strong></div><div class="health-track"><i id="healthFill"></i></div></div>
 <div id="joystick"><div id="stick"></div></div>
 <div class="actions"><button id="jump" class="jump-btn"><span>↗</span><small>PULAR</small></button><button id="fire" class="fire-btn"><span>◎</span><small>ATIRAR</small></button><button id="reload" class="reload-btn"><span>↻</span><small>RECARGA</small></button></div>
 <div class="ammo-panel"><b id="ammoLarge">30</b><span>/ 30<br>MUNIÇÃO</span></div>
 <div id="hint">MOVA • DESLIZE PARA OLHAR • ATIRE</div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module" src="./game.js"></script>
<script>
window.addEventListener('error',e=>{if(e.message){document.querySelector('#loading').style.display='none';document.querySelector('#errorPanel').style.display='grid';document.querySelector('#errorMessage').textContent='Erro ao iniciar: '+e.message}});
window.addEventListener('unhandledrejection',e=>{document.querySelector('#loading').style.display='none';document.querySelector('#errorPanel').style.display='grid';document.querySelector('#errorMessage').textContent='Falha ao carregar os gráficos 3D. Confira a internet e tente novamente.'});
</script>
</body></html>
