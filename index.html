<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ilha de Combate — 3D</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="game"></div>
<div id="loading">CARREGANDO ILHA DE COMBATE 3D…</div>
<div id="errorPanel"><div><h1>Não foi possível iniciar o jogo</h1><p id="errorMessage">Verifique sua conexão com a internet e tente novamente.</p><button onclick="location.reload()">TENTAR NOVAMENTE</button></div></div>
<div id="hud">
 <div class="topbar"><strong>ILHA DE COMBATE</strong><span id="status">PRONTO</span></div>
 <div class="stats"><span id="health">VIDA 100</span><span id="ammo">MUNIÇÃO 30</span><span id="score">ELIMINAÇÕES 0</span></div>
 <div id="joystick"><div id="stick"></div></div>
 <div id="lookArea" aria-label="Arraste para mirar"></div>
 <div class="actions"><button id="jump">PULAR</button><button id="fire">ATIRAR</button><button id="reload">RECARREGAR</button></div>
 <div id="hint">Carregando cenário 3D…</div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module" src="./game.js"></script>
<script>
window.addEventListener('error',e=>{if(e.message){document.querySelector('#loading').style.display='none';document.querySelector('#errorPanel').style.display='grid';document.querySelector('#errorMessage').textContent='Erro ao iniciar: '+e.message}});
window.addEventListener('unhandledrejection',e=>{document.querySelector('#loading').style.display='none';document.querySelector('#errorPanel').style.display='grid';document.querySelector('#errorMessage').textContent='Falha ao carregar os gráficos 3D. Confira a internet e tente novamente.'});
</script>
</body></html>
